name: Reusable release-please

# adr:deterministic-fleet-versioning. Manifest mode: one release PR per package, tags
# <package>-vX.Y.Z. Versions and changelogs come from commit types; nothing here deploys.
# A tag never ships anything by itself: each service stages the tagged commit and the owner
# promotes it by naming the revision.
#
# Call it from a push-to-default-branch workflow, pinned to a Core commit SHA:
#   on: { push: { branches: [main] } }
#   permissions: { contents: write, pull-requests: write }
#   jobs:
#     release-please:
#       uses: ojfbot/core/.github/workflows/reusable-release-please.yml@<core-commit-sha>
#       secrets: inherit   # optional RELEASE_PLEASE_TOKEN, see below
#
# Token. With the default GITHUB_TOKEN, release-please's PRs and tags do not trigger other
# workflows, so required checks never start on a release PR. Give the calling repo a secret named
# RELEASE_PLEASE_TOKEN (a fine-grained token with contents and pull-requests write on this repo
# only) to make them run. The repo setting "Allow GitHub Actions to create and approve pull
# requests" must be on either way.
on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: false
    outputs:
      releases_created:
        description: "'true' when this run created at least one release (tag)."
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        description: JSON array of the package paths released by this run.
        value: ${{ jobs.release-please.outputs.paths_released }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
