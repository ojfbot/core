name: Reusable commitlint

# adr:deterministic-fleet-versioning. Lints every commit in a pull request and the pull request
# title against the fleet's shared rules (packages/commitlint-config). On a push to the default
# branch it lints every pushed commit (a backstop for direct pushes; the pull request check is the
# gate, enforced by making it a required status check on the default branch).
#
# Call it from a workflow triggered by pull_request (and push to the default branch), pinned to a
# Core commit SHA:
#   jobs:
#     commitlint:
#       uses: ojfbot/core/.github/workflows/reusable-commitlint.yml@<core-commit-sha>
# The check run is named "<caller job id> / commitlint"; name the caller job `commitlint` so the
# required check is "commitlint / commitlint".
#
# The rules, the commitlint version and its lockfile are read from Core at that same SHA
# (job.workflow_sha), so the one pin controls everything and a change to Core cannot silently change
# a repo's checks. commitlint is installed with `pnpm install --frozen-lockfile` from the lockfile in
# packages/commitlint-config, so none of its dependencies is resolved fresh on a run. Cost: history
# without file contents for the calling repo, two sparse paths from Core, one small frozen install.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a pull request or push and a resolvable workflow ref
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          [[ "$EVENT" == "pull_request" || "$EVENT" == "push" ]] || { echo "::error::Call this workflow from a pull_request or push event, not $EVENT."; exit 1; }
          [[ "$EVENT" == "pull_request" || "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] || { echo "::error::This push has no previous commit to lint from."; exit 1; }
          [[ -n "$WORKFLOW_REPO" && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve this workflow's own repository and commit (job.workflow_repository / job.workflow_sha); refusing to guess which rules to apply."
            exit 1
          }

      - name: Check out the history to lint (commits only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Check out the shared rules at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .fleet-core
          sparse-checkout: |
            package.json
            packages/commitlint-config
            scripts/fleet-versioning
          persist-credentials: false

      - name: Install pnpm (the version Core pins)
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: .fleet-core/package.json

      - name: Lint every commit, then the pull request title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_TITLE_SKIP_REASON: a push to the default branch has no pull request title
        # One script for CI and `pnpm verify`: same rules file, same locked CLI.
        run: node .fleet-core/scripts/fleet-versioning/lint-commits.mjs
