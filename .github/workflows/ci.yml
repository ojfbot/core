name: CI

on: [push, pull_request]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The G0 contract test resolves an approved Core baseline commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: User-scope installer and hook isolation regression
        run: python3 -m unittest discover -s scripts/__tests__ -p 'test_*.py' -v

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: FleetRunner isolated proof helpers
        run: pnpm --filter @core/fleet-runner proof:local:test

      - name: Launcher registrations test (ADR-0058)
        run: pnpm --filter @core/launcher-tests test

      - name: FleetRunner G6 script tests
        run: pnpm --filter @core/fleet-runner g6:test

      # The G0 contract test reads two approved baseline commits that are on no default branch
      # (Core and BookcaseDiscovery), so the script fetches each by exact SHA, retries once, and
      # fails with a clear message if one is gone. The Core checkout is full-history for it.
      - name: FleetRunner G0 contract test
        run: |
          client="$(bash scripts/fleet-runner/fetch-g0-baselines.sh "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/BookcaseDiscovery")"
          FLEET_RUNNER_CLIENT_REPO="$client" pnpm exec vitest run --config vitest.g0.config.ts

      - name: Skill script tests (bead, vault)
        run: |
          # PyYAML is installed here, not assumed from the runner image (pip is blocked on system Python).
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 -m unittest discover -s .claude/skills/bead/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s .claude/skills/vault/scripts -p 'test_*.py' -v

      - name: Every test file is wired into CI
        run: node scripts/check-test-wiring.mjs

  check-provenance:
    name: Check ADR Provenance (ADR-0065)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `git cat-file -e <sha>` resolves Provenance SHAs.
          fetch-depth: 0

      - name: Run provenance check
        run: bash scripts/check-provenance.sh
