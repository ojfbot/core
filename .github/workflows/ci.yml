name: CI

on: [push, pull_request]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: User-scope installer and hook isolation regression
        run: python3 scripts/__tests__/test_user_scope_install.py -v

      # adr:deterministic-fleet-versioning. The commit range and title checks run in versioning.yml,
      # and `pnpm verify` runs them as versioning/commitlint; this one needs no pull request event.
      - name: Every package is covered by release-please
        run: node scripts/fleet-versioning/check-versions.mjs coverage

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: FleetRunner isolated proof helpers
        run: pnpm --filter @core/fleet-runner proof:local:test

      - name: Launcher registrations test (ADR-0058)
        run: pnpm --filter @core/launcher-tests test

  check-provenance:
    name: Check ADR Provenance (ADR-0065)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `git cat-file -e <sha>` resolves Provenance SHAs.
          fetch-depth: 0

      - name: Run provenance check
        run: bash scripts/check-provenance.sh
