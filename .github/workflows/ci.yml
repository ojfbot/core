name: CI

on: [push, pull_request]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: User-scope installer and hook isolation regression
        run: python3 scripts/__tests__/test_user_scope_install.py -v

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Launcher registrations test (ADR-0058)
        run: pnpm --filter @core/launcher-tests test

  env-files:
    name: Env files stay untracked (adr:package-env-files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: env-files-check (fails on tracked env files or real-looking example values)
        run: node scripts/env-files-check.mjs --check

      - name: Python settings template tests (the TypeScript twin runs under pnpm test)
        run: python3 -I -B -m unittest discover -s scripts/templates/package-settings -p 'test_*.py' -v

  check-provenance:
    name: Check ADR Provenance (ADR-0065)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `git cat-file -e <sha>` resolves Provenance SHAs.
          fetch-depth: 0

      - name: Run provenance check
        run: bash scripts/check-provenance.sh
