# northstar-lint — the cluster's first shadow→operational RIDM promotion (rm-l2-ojfbot#S16).
# Blocks on lint ERRORs only; WARNs stay shadow. Registered files living in sibling repos are
# unreachable from this single-repo checkout and downgrade to WARNs (vantage scoping) — the
# gate never fails a PR over a checkout it cannot see. RIDM note: decisions/northstar/README.md.
name: northstar-lint

on:
  pull_request:
    paths:
      - 'decisions/northstar/**'
      - 'scripts/roadmap-lint.mjs'
      - 'scripts/northstar-lint.mjs'
      - 'scripts/lib/northstar-fm.mjs'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dep-free .mjs scripts — no pnpm install needed.
      - name: roadmap-lint (blocking on ERRORs)
        run: node scripts/roadmap-lint.mjs --check
      # CI checks out only Core, so registered entries whose repo is not on disk are skipped, not
      # checked. The skipped count is fixed by the registry and this checkout (23 of 26), so the
      # limit is exactly that number: a new registered entry that CI cannot see, or a lost entry
      # that used to be reachable, turns this red. Lower it when more repos are checked out; raise
      # it only as a deliberate decision when a northstar is registered (core#724).
      - name: northstar-lint (blocking on ERRORs and on skipped growth)
        run: node scripts/northstar-lint.mjs --check --max-skipped 23
      - name: northstar-lint coverage (job summary)
        if: always()
        run: |
          {
            echo '### northstar-lint coverage'
            echo '```'
            node scripts/northstar-lint.mjs --format=summary
            node scripts/northstar-lint.mjs | grep '^Checked '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
