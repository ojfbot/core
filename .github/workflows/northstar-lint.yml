# northstar-lint — the cluster's first shadow→operational RIDM promotion (rm-l2-ojfbot#S16).
# Blocks on lint ERRORs only; WARNs stay shadow. Registered files living in sibling repos are
# unreachable from this single-repo checkout and downgrade to WARNs (vantage scoping) — the
# gate never fails a PR over a checkout it cannot see. RIDM note: decisions/northstar/README.md.
name: northstar-lint

on:
  pull_request:
    paths:
      - 'decisions/northstar/**'
      - 'scripts/roadmap-lint.mjs'
      - 'scripts/northstar-lint.mjs'
      - 'scripts/lib/northstar-fm.mjs'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dep-free .mjs scripts — no pnpm install needed.
      - name: roadmap-lint (blocking on ERRORs)
        run: node scripts/roadmap-lint.mjs --check
      - name: northstar-lint (blocking on ERRORs)
        run: node scripts/northstar-lint.mjs --check
      # Entries whose repo is not checked out here are skipped, not checked. Show how many in the
      # job summary. No --max-skipped limit is set yet: the count seen in CI has not been measured
      # across runs, and a wrong limit would turn unrelated PRs red. Once it is stable, add
      # `--max-skipped N` to the step above so coverage cannot shrink unnoticed (core#724).
      - name: northstar-lint coverage (job summary)
        if: always()
        run: |
          {
            echo '### northstar-lint coverage'
            echo '```'
            node scripts/northstar-lint.mjs --format=summary
            node scripts/northstar-lint.mjs | grep '^Checked '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
